# The live control tier, on a clock. The hermetic tier gates every push, but
# the live tier (same 333 controls, same grader, real database) only ran when
# someone remembered to run it — so the claim/proof gap could rot silently
# between manual runs. Weekly --check keeps the scoreboard honest: any control
# that was live-green in the committed baseline and stops producing its
# evidence against the real schema fails this workflow by name.
#
# Sunday 05:23 UTC: clear of the daily reporters (06:17), the Monday smoke
# (13:00), and any waking human likely to be mid-harness-run — live runs are
# exclusive; nothing else may load the drill schemas while one is in flight.
#
# Requires SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY secrets. Until both are
# set the job reports itself skipped rather than failing the schedule (the
# aggregator-reporters guard pattern).
name: live-control-tier
on:
  schedule:
    - cron: "23 5 * * 0" # weekly, Sunday 05:23 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          check = fail if a baseline-green control went red;
          refresh = re-run the tier and COMMIT the new control-tests-live.json
          (+ regenerated STATE.md) as the baseline
        type: choice
        options: [check, refresh]
        default: check

permissions:
  contents: write

jobs:
  live-check:
    runs-on: ubuntu-latest
    # The dispatch-proof run took 43 minutes — ~10k sequential round-trips
    # from the runner to the database, all latency. 90 gives 2x headroom;
    # without a cap a genuine hang burns the 6-hour default.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Guard — secrets present?
        id: guard
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY not set — skipping (set both to activate the schedule)" >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: denoland/setup-deno@v2
        if: steps.guard.outputs.run == 'true'
        with:
          deno-version: v2.x

      - name: Live control tier — a control proven live must stay proven
        if: steps.guard.outputs.run == 'true' && inputs.mode != 'refresh'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: deno run --allow-all core/supabase/functions/drill/controls_live_run.ts --check

      # Refresh mode exists because the full tier is ~10k sequential
      # round-trips: from CI (low latency to the database) it is ~45 minutes,
      # from a residential connection it measured 12+ hours. The baseline
      # artifact should be refreshed from here, not from a laptop.
      - name: Live control tier — refresh the committed baseline
        if: steps.guard.outputs.run == 'true' && inputs.mode == 'refresh'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: deno run --allow-all core/supabase/functions/drill/controls_live_run.ts

      - name: Regenerate STATE.md and the architecture inventory (live numbers changed with the baseline)
        if: steps.guard.outputs.run == 'true' && inputs.mode == 'refresh'
        run: |
          python3 -m pip install pyyaml
          python3 scripts/gen_state.py
          python3 scripts/gen_architecture.py

      - name: Commit refreshed baseline
        if: steps.guard.outputs.run == 'true' && inputs.mode == 'refresh'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control-tests-live.json STATE.md docs/architecture/system.json
          if git diff --cached --quiet; then
            echo "Baseline already current — nothing to commit."
            exit 0
          fi
          git commit -m "chore(compliance): refresh live control-tier baseline"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
