name: Rebuild controls + vocabulary artifacts

# Deterministic, mechanical re-extraction. Whenever a generated policy ({slug}.md),
# the engineering spec (core-api.yaml / vocab-migration.json), or the extractor
# scripts change on main, this rebuilds the four derived JSON artifacts and
# auto-commits whatever actually changed straight back to main.
#
# These are pure functions of their inputs (stdlib-only, sub-second, no API key),
# so there is nothing to review — the diff just mirrors the source change that was
# already reviewed. Hence: commit to main, no PR.
#
# Pipeline (dependency order):
#   core/core-api.yaml (x-events registry; vocab-migration.json only for
#   provisional fields) --parse_core_api.py-->                          core-vocabulary.json
#   policies {slug}.md  (+ core-vocabulary.json to classify) --extract_controls.py-->  controls.json
#   controls.json + core-vocabulary.json --build_control_vocabulary.py--> control-vocabulary.json
#   policies {slug}.md --extract_vocab.py-->                            extracted-vocab.json
#
# Loop-safety (two guarantees; #1 is load-bearing since the commit set began
# including core/core-api.yaml, which IS a trigger path — the restamped spec
# rides back on the same commit as the artifacts derived from it):
#   1. A push made with GITHUB_TOKEN does NOT trigger further workflow runs.
#   2. The commit step is a no-op when nothing changed.

on:
  push:
    branches: [main]
    paths:
      # Policies live at compliance/policies/{slug}/{slug}.md. The walk is scoped there
      # (extract_controls.POLICY_ROOT_PARTS), so the trigger is scoped to match — core/ and
      # ui/ need no exclusion now that the pattern names the policy tree directly.
      - "compliance/policies/*/*.md"
      - "!**/prompt.md"      # prompt.md is a regen INPUT, not an extraction input
      - "core/core-api.yaml" # moved under core/ in 2078a19 — a bare "core-api.yaml"
                             # here silently stopped triggering on spec changes
      - "core/supabase/migrations/*.sql"  # schema parity must see migration changes
      - "core/supabase/functions/api/index.ts"        # route parity inputs
      - "core/supabase/functions/api/routes.gen.ts"
      - "vocab-migration.json"
      - "core/supabase/functions/drill/**"     # drill sources -> drill.json + docs/drill.md
      - "crosswalk-emitted-events.json"        # inventory the drill cross-references
      - "scripts/*.py"       # extractor logic (incl. code_format.py)
  # PRs run the full rebuild + every gate but SKIP the commit step, so
  # divergence surfaces on the PR instead of post-merge on main.
  pull_request:
    paths:
      - "compliance/policies/*/*.md"
      - "!**/prompt.md"
      - "core/core-api.yaml"
      - "core/supabase/migrations/*.sql"
      - "core/supabase/functions/api/index.ts"
      - "core/supabase/functions/api/routes.gen.ts"
      - "vocab-migration.json"
      - "core/supabase/functions/drill/**"     # drill sources -> drill.json + docs/drill.md
      - "crosswalk-emitted-events.json"        # inventory the drill cross-references
      - "scripts/*.py"
  workflow_dispatch: {}      # manual full rebuild

permissions:
  contents: write

concurrency:
  # Serialize runs so two rebuilds never race to push main. Let each finish —
  # a cancelled rebuild could leave a stale artifact uncommitted.
  group: extract-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    env:
      # Don't litter scripts/__pycache__ when extract_controls imports code_format.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so the post-rebuild push can fast-forward cleanly.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        # Only parse_core_api.py needs it; the other three extractors are stdlib-only.
        run: python3 -m pip install pyyaml

      - name: Set up Deno
        # The drill step in rebuild_artifacts.sh regenerates drill.json +
        # docs/drill.md (it ran only by hand before, so both went stale).
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Rebuild artifacts (dependency order)
        # The ordered list lives in ONE place — scripts/rebuild_artifacts.sh —
        # shared with the workflow documented in CLAUDE.md.
        run: ./scripts/rebuild_artifacts.sh

      - name: Commit refreshed artifacts to main
        # push-to-main only — a PR run rebuilds and gates but never commits
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          arts="controls.json control-vocabulary.json core-vocabulary.json extracted-vocab.json
                crosswalk.json CROSSWALK.md STATE.md ui/public/compliance-manifest.json
                core/verifier/targets.json core/verifier/worklist.md
                core/core-api.yaml core/supabase/functions/api/routes.gen.ts
                ui/src/lib/coreApi.allowlist.json ui/src/lib/core-api-types.d.ts
                drill.json docs/drill.md docs/proposed-surface.md"
          git add -- $arts

          if git diff --cached --quiet; then
            echo "Artifacts already current — nothing to commit."
            exit 0
          fi

          echo "Changed artifacts:"; git diff --cached --name-only
          git commit -m "chore(artifacts): rebuild controls + vocabulary from ${GITHUB_SHA::7}"

          # Race guard: a concurrent run (or human) may have moved main meanwhile.
          # --autostash is a no-op here (tree is clean post-commit) but harmless.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # This gate lives HERE and not only in core-ci.yml because of loop-safety
      # guarantee #1 above: the push made one step up uses GITHUB_TOKEN, so it
      # triggers no further workflow runs. core-ci.yml never sees the rebuilt
      # core-vocabulary.json. A core-api.yaml change that drops a term a policy
      # depends on would rebuild the vocabulary, commit it, and go green — the
      # break surfacing on whoever pushed next, detached from its cause.
      #
      # It runs AFTER the commit deliberately. The artifacts are a pure function
      # of the spec and are true whatever the policies say; withholding them
      # would only make the next run diff against a stale base. So: record the
      # truth, then fail the build about it.
      - name: Vocabulary drift — no policy may cite a code the core dropped
        run: python3 scripts/check_vocab_drift.py --check

      - name: Emitted coverage — no emitted code may be missing from x-events
        # The inverse gate: the registry must cover the supply side too, or the
        # crosswalk measures reachability across a vocabulary gap (this is how
        # 41 emitted codes went unregistered for six weeks unnoticed).
        run: python3 scripts/check_emitted_coverage.py

      - name: Route parity — spec paths and the router must agree exactly
        run: python3 scripts/check_route_parity.py

      - name: Schema parity — spec schemas vs migrations (ratchet)
        # Fails only on NEW divergence beyond schema-parity-baseline.json.
        # Needs pyyaml, so it lives here rather than core-ci.yml.
        run: python3 scripts/check_schema_parity.py --check

      - name: All derived artifacts are committed-current
        # The rebuild step above regenerated EVERYTHING from this ref's inputs,
        # so any working-tree diff now means the ref shipped stale artifacts.
        # On push runs the commit step already folded changes in (diff is
        # clean); on PR runs this is the gate with actual signal — the
        # per-generator --check steps that used to sit here compared each
        # just-rewritten file against a second rebuild of itself and could
        # never fail. One diff covers all 13 artifacts, including worklist.md
        # and the restamped spec, at zero recompute.
        run: git diff --exit-code
