# Publish the architecture tour to GitHub Pages.
#
# Until 2026-09 this also published the standalone compliance dashboard
# (compliance/dashboard/). That dashboard is now native in the banking UI, and
# the API's /compliance/dashboard route redirects to the deployed console, so
# only the architecture tour remains on Pages.
#
# Pages serves from a `workflow` source (not "deploy from branch"): this job
# stages the files under _site and uploads that. docs/pages-root.html becomes
# the site index so the bare URL routes instead of 404ing, and /architecture/
# is the interactive viewer, its hand-traced model and its generated inventory.
#
# No path filter: the inventory (system.json) is derived from the spec, the
# api/ modules, the flows and the compliance artifacts, so almost any push can
# change it. The job regenerates it from the pushed tree before staging, and
# also runs after the artifact rebuild and the live-tier refresh, whose
# bot-made commits would not trigger a push event.
name: pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Rebuild controls + vocabulary artifacts", "live-control-tier"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-flight one finish rather than
# publishing a half-built site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # a workflow_run must publish main as it is now, bot commits included

      - name: Regenerate the architecture inventory from this tree
        run: |
          python3 -m pip install pyyaml
          python3 scripts/gen_architecture.py

      - name: Validate architecture snapshot and navigation
        # A hand-traced source that changed since review is written to
        # stale.json (the traced views show it) instead of blocking the deploy:
        # the generated inventory must publish on every change. doc-gate stays
        # strict, and architecture-retrace proposes the re-trace for review.
        run: |
          python3 scripts/check_architecture.py --stale-report docs/architecture/stale.json
          node --test docs/architecture/navigation.test.mjs

      - name: Stage the architecture tour one level down
        run: |
          set -euo pipefail
          mkdir -p _site/architecture
          cp docs/architecture/index.html docs/architecture/*.md docs/architecture/*.css docs/architecture/*.json _site/architecture/
          cp docs/architecture/explorer.mjs docs/architecture/navigation.mjs docs/architecture/inventory.mjs docs/architecture/diagram.mjs _site/architecture/
          cp docs/pages-root.html _site/index.html   # the bare URL routes, not 404s
          # Fail loudly rather than deploying an empty site.
          test -f _site/index.html
          test -f _site/architecture/index.html
          test -f _site/architecture/README.md
          test -f _site/architecture/model.json
          test -f _site/architecture/explorer.mjs
          test -f _site/architecture/system.json
          test -f _site/architecture/inventory.mjs
          test -f _site/architecture/diagram.mjs
          test -f _site/architecture/stale.json
          echo "staged $(find _site -type f | wc -l) files"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  # Every deploy is verified on the live site the way a reviewer uses it, and
  # each view's resting picture is scored so runs can be compared.
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the browser harness
        working-directory: docs/architecture/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Wait until the live site serves this commit's explorer
        run: |
          for f in explorer.mjs inventory.mjs diagram.mjs; do
            for i in $(seq 1 30); do
              curl -fsS "$SITE/architecture/$f" | cmp -s - "docs/architecture/$f" && continue 2
              sleep 10
            done
            echo "live $f never matched this commit"; exit 1
          done
        env:
          SITE: https://cassandra-labs-foundation.github.io/cassandra-platform
      - name: End-to-end walk of the live explorer
        working-directory: docs/architecture/e2e
        env:
          BASE_URL: https://cassandra-labs-foundation.github.io/cassandra-platform
        run: npm test
      - name: Screenshot and score every view
        if: always()
        working-directory: docs/architecture/e2e
        run: |
          npm run shots -- ../../../explorer-shots https://cassandra-labs-foundation.github.io/cassandra-platform
          { echo '## Architecture explorer · live scores'; echo; cat ../../../explorer-shots/scores.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: explorer-shots
          path: explorer-shots
          retention-days: 30
