# Cards 59/60/62 — the SCHEDULED half of the reporters' Done criteria.
#
# Daily: archive events to Parquet (card 62's watermark sync), run the BSA
# 90-day lookback (59) and the 5300 aggregation (60). Evidence rows land in
# Postgres; new Parquet files are committed back to main, making git the
# cold archive of record (versioned, tamper-evident — a records-retention
# property, not just a storage choice).
#
# Requires the SUPABASE_DB_URL secret (session-pooler URI). Until it is set
# the job reports itself skipped rather than failing the schedule.
name: aggregator-reporters
on:
  schedule:
    - cron: "17 6 * * *" # daily 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reporters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard — secret present?
        id: guard
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB" ]; then
            echo "SUPABASE_DB_URL secret is not set — skipping (set it to activate the schedule)" >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install DuckDB CLI
        if: steps.guard.outputs.run == 'true'
        run: |
          curl -sSL https://github.com/duckdb/duckdb/releases/download/v1.1.3/duckdb_cli-linux-amd64.zip -o /tmp/duckdb.zip
          unzip -o /tmp/duckdb.zip -d /usr/local/bin
          duckdb --version

      - name: Archive to Parquet (card 62)
        if: steps.guard.outputs.run == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: ./analytics/archive.sh

      - name: BSA Reporter — 90-day lookback (card 59)
        if: steps.guard.outputs.run == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: ./analytics/bsa_reporter.sh

      - name: 5300 Reporter (card 60)
        if: steps.guard.outputs.run == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: ./analytics/report_5300.sh

      - name: Commit new Parquet to the archive of record
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "aggregator-reporters[bot]"
          git config user.email "noreply@cassandra.bank"
          git add analytics/archive/*.parquet || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(archive): daily Parquet archive sweep"
            git push
          else
            echo "no new archive files"
          fi

      # After the push, deliberately: rows leave Postgres only once the
      # archive of record holds them. prune.sh bounds by committed parquet
      # coverage; prune_archived adds watermark + consumer-cursor + 72h
      # guards (migration 20260811000100).
      - name: Prune hot rows the cold tier serves
        if: steps.guard.outputs.run == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: ./analytics/prune.sh
